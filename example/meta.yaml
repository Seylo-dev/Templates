schema: # the install form; the panel asks for the service name and the node itself
  type: object
  required: ["image"]
  properties:
    image:
      type: "string"
      title: "Image"
      description: "Docker image and tag to run."
      default: "example/app:1.0.0" # TODO: the app's own image, pinned to a version (never latest)
    adminEmail:
      type: "string"
      title: "Admin email"
      description: "The first admin account."
    adminPassword:
      type: "string"
      format: "password" # left empty, the panel generates one
      title: "Admin password"
    logLevel:
      type: "string"
      title: "Log level"
      enum: ["info", "debug", "warn"] # a select
      default: "info"
